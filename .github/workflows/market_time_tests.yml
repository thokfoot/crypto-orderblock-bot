name: Market Time Guard Tests

on:
  push:
    branches: [main]
    paths:
      - "scripts/market_time_utils.py"
      - "scripts/market_data_fallback.py"
      - "scripts/v325_us_cloud_runner.py"
      - "scripts/v325_nse_cloud_runner.py"
      - "scripts/dry_run_data_check.py"
      - "tests/**"
      - ".github/workflows/market_time_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-time-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --upgrade pip pandas requests yfinance

      - name: Run market-time unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile trading scripts
        run: python -m py_compile scripts/market_time_utils.py scripts/market_data_fallback.py scripts/v325_us_cloud_runner.py scripts/v325_nse_cloud_runner.py scripts/dry_run_data_check.py
