name: Strategy v3.2.5 NSE Autonomous Engine

on:
  schedule:
    # 04:06 UTC = 09:36 IST (Monday to Friday); script rejects late starts.
    - cron: '6 4 * * 1-5'
  repository_dispatch:
    types: [nse_scan]
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (audits Day 24 Friday data)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: v325-nse-engine
  cancel-in-progress: false

jobs:
  run-nse-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Strategy Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Validate market-time helpers
        run: python -m unittest discover -s tests -v

      - name: Launch Autonomous Engine
        env:
          AUTOMATION_TELEGRAM_BOT_TOKEN: ${{ secrets.AUTOMATION_TELEGRAM_BOT_TOKEN }}
          AUTOMATION_TELEGRAM_CHAT_ID: ${{ secrets.AUTOMATION_TELEGRAM_CHAT_ID }}
          FYERS_CLIENT_ID: ${{ secrets.FYERS_CLIENT_ID }}
          FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.test_mode }}" = "true" ]; then
            python scripts/v325_nse_cloud_runner.py --test
          else
            python scripts/v325_nse_cloud_runner.py
          fi
