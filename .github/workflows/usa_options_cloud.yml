name: USA SPY Options Spread Cloud Daemon

on:
  schedule:
    # 1. US Market Open trigger (Mon-Fri).
    #    America/New_York observes DST, so the UTC instant shifts twice a year:
    #      13:30 UTC = 09:30 EDT (summer, UTC-4) / 08:30 EST (winter, UTC-5)
    #      14:30 UTC = 09:30 EST (winter, UTC-5) / 10:30 EDT (summer, UTC-4)
    #    The daemon's is_market_open() clock sleeps until the real 09:30 ET, so BOTH
    #    triggers are added to guarantee a live run at the open in either regime.
    - cron: '30 13 * * 1-5'
    - cron: '30 14 * * 1-5'
    # 2. Mid-Session Failover at 10:00 PM IST (16:30 UTC / 12:30 PM ET) (Mon-Fri)
    - cron: '30 16 * * 1-5'
    # 3. Continuous weekday 3-hour backup chain (weekends handled by is_market_open)
    - cron: '0 */3 * * 1-5'
  workflow_dispatch:
    inputs:
      run_minutes:
        description: 'Duration to run (in minutes)'
        required: false
        default: '170'

permissions:
  contents: write

concurrency:
  group: usa-options
  cancel-in-progress: true

jobs:
  run-usa-daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 185

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run USA SPY Options Daemon
        env:
          USA_TELEGRAM_BOT_TOKEN: ${{ secrets.USA_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MINUTES: ${{ github.event.inputs.run_minutes || '170' }}
          POLL_INTERVAL_SECS: 2
        run: |
          echo "========================================================"
          echo "Starting USA SPY Options Spread Daemon in Cloud..."
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "========================================================"
          python usa_options_daemon.py || true

      - name: Persist USA Dashboard State
        if: always()
        run: |
          mkdir -p /tmp/state_backup
          cp data/usa_dashboard.json /tmp/state_backup/usa_dashboard.json 2>/dev/null || true
          cp data/usa_paper_trades.csv /tmp/state_backup/usa_paper_trades.csv 2>/dev/null || true
          cp usa_dashboard.json /tmp/state_backup/usa_dashboard_root.json 2>/dev/null || true
          cp data/usa_*_state.json /tmp/state_backup/ 2>/dev/null || true
          cp data/usa_*_trades.csv /tmp/state_backup/ 2>/dev/null || true

          git fetch origin main
          git reset --hard origin/main

          mkdir -p data
          cp /tmp/state_backup/usa_dashboard.json data/ 2>/dev/null || true
          cp /tmp/state_backup/usa_paper_trades.csv data/ 2>/dev/null || true
          if [ -f /tmp/state_backup/usa_dashboard_root.json ]; then
            cp /tmp/state_backup/usa_dashboard_root.json usa_dashboard.json
          fi
          cp /tmp/state_backup/usa_*_state.json data/ 2>/dev/null || true
          cp /tmp/state_backup/usa_*_trades.csv data/ 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch data/usa_paper_trades.csv 2>/dev/null || true
          git add -f data/usa_dashboard.json usa_dashboard.json data/usa_paper_trades.csv data/usa_*_state.json data/usa_*_trades.csv
          if git diff --cached --quiet; then
            echo "No USA state changes to commit."
          else
            git commit -m "state: usa-sync $(date -u +'%Y-%m-%d %H:%M:%S UTC') [skip ci]"
            pushed=0
            for i in 1 2 3; do
              git fetch origin main
              git pull --rebase --autostash origin main || true
              if git push origin main; then pushed=1; break; fi
              echo "Push attempt $i failed; retrying..."
              sleep $((i * 2))
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::warning:: state push failed after retries (kept committed locally)"
            fi
          fi
