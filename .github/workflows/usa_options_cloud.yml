name: USA SPY Options Spread Cloud Daemon

on:
  schedule:
    # 1. Exact 7:00 PM IST (13:30 UTC / 09:30 AM EST) US Market Open Trigger (Mon-Fri)
    - cron: '30 13 * * 1-5'
    # 2. Mid-Session Failover at 10:00 PM IST (16:30 UTC / 12:30 PM EST) (Mon-Fri)
    - cron: '30 16 * * 1-5'
    # 3. Continuous 3-hour backup chain
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      run_minutes:
        description: 'Duration to run (in minutes)'
        required: false
        default: '170'

permissions:
  contents: write

concurrency:
  group: usa-options
  cancel-in-progress: true

jobs:
  run-usa-daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 185

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run USA SPY Options Daemon
        env:
          USA_TELEGRAM_BOT_TOKEN: ${{ secrets.USA_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MINUTES: ${{ github.event.inputs.run_minutes || '170' }}
          POLL_INTERVAL_SECS: 2
        run: |
          echo "========================================================"
          echo "Starting USA SPY Options Spread Daemon in Cloud..."
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "========================================================"
          python usa_options_daemon.py || true

      - name: Persist USA Dashboard State
        if: always()
        run: |
          mkdir -p /tmp/state_backup
          cp data/usa_dashboard.json /tmp/state_backup/ 2>/dev/null || true
          cp data/usa_paper_trades.csv /tmp/state_backup/ 2>/dev/null || true
          cp usa_dashboard.json /tmp/state_backup/ 2>/dev/null || true

          git fetch origin main
          git reset --hard origin/main

          mkdir -p data
          cp /tmp/state_backup/usa_dashboard.json data/ 2>/dev/null || true
          cp /tmp/state_backup/usa_paper_trades.csv data/ 2>/dev/null || true
          if [ -f /tmp/state_backup/usa_dashboard.json ]; then
            cp /tmp/state_backup/usa_dashboard.json .
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch data/usa_paper_trades.csv 2>/dev/null || true
          git add data/usa_dashboard.json usa_dashboard.json data/usa_paper_trades.csv -f
          if git diff --cached --quiet; then
            echo "No USA state changes to commit."
          else
            git commit -m "state: usa-sync $(date -u +'%Y-%m-%d %H:%M:%S UTC') [skip ci]"
            git push origin main || (git pull --rebase origin main && git push origin main)
          fi
