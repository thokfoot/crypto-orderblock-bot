name: _diag binance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pandas
      - name: Probe candidate funding endpoints
        run: |
          for u in \
            "https://fapi1.binance.com/fapi/v1/fundingRate?symbol=BTCUSDT&limit=2" \
            "https://fapi2.binance.com/fapi/v1/fundingRate?symbol=BTCUSDT&limit=2" \
            "https://www.binance.com/fapi/v1/fundingRate?symbol=BTCUSDT&limit=2" \
            "https://www.binance.com/bapi/futures/v1/friendly/future/common/bigInt/fundingRate?symbol=BTCUSDT" \
            "https://www.binance.com/bapi/futures/v1/public/future/common/bigInt/getFundingRateHistory?symbol=BTCUSDT&limit=2" \
            "https://api.binance.com/api/v3/time" \
            "https://data.binance.vision/data/futures/um/daily/fundingRate/BTCUSDT/BTCUSDT-fundingRate-2026-10-14.zip" ; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" "$u")
            echo "HTTP $code :: $u"; head -c 200 /tmp/body; echo; echo "----"
          done
      - name: Parse data.binance.vision daily funding ZIP
        run: |
          python - <<'PY'
          import urllib.request, zipfile, io, csv
          url="https://data.binance.vision/data/futures/um/daily/fundingRate/BTCUSDT/BTCUSDT-fundingRate-2026-10-14.zip"
          try:
              req=urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
              raw=urllib.request.urlopen(req, timeout=20).read()
              print("zip bytes:", len(raw))
              z=zipfile.ZipFile(io.BytesIO(raw))
              print("names:", z.namelist())
              with z.open(z.namelist()[0]) as f:
                  rows=list(csv.reader(io.TextIOWrapper(f)))
              print("csv header:", rows[0])
              print("last 3 rows:", rows[-3:])
          except Exception as e:
              print("ZIP FAILED:", type(e).__name__, e)
          PY
