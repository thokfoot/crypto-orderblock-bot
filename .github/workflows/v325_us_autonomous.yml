name: Strategy v3.2.5 US Autonomous Engine

on:
  schedule:
    # The script itself accepts only 10:03-10:15 America/New_York.
    # Dual UTC schedules cover both EST and EDT; the off-season run self-skips.
    - cron: '5 14 * * 1-5'
    - cron: '5 15 * * 1-5'
  repository_dispatch:
    types: [us_scan]
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: v325-us-engine
  cancel-in-progress: false

jobs:
  run-us-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Validate market-time helpers
        run: python -m unittest discover -s tests -v

      - name: Launch US Autonomous Engine
        env:
          AUTOMATION_TELEGRAM_BOT_TOKEN: ${{ secrets.AUTOMATION_TELEGRAM_BOT_TOKEN }}
          AUTOMATION_TELEGRAM_CHAT_ID: ${{ secrets.AUTOMATION_TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.test_mode }}" = "true" ]; then
            python scripts/v325_us_cloud_runner.py --test
          else
            python scripts/v325_us_cloud_runner.py
          fi
